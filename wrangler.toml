name = "robot-world-war"
main = "src/worker.js"
compatibility_date = "2026-11-10"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/telegram/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "robot-world-war-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Set MINI_APP_URL to the deployed Pages/Workers URL in Cloudflare settings.
