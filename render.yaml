services:
  - type: web
    name: robot-world-war
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: robot-world-war-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: robot-world-war-db
    databaseName: robotworldwar
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
