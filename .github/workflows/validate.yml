name: Validate game source and realistic map

on:
  push:
    branches: [main, realistic-world-v2, feature/realistic-world-rebuild-2026, feature/complete-world-map-overhaul, feature/real-world-simulation-overhaul]
  pull_request:
    branches: [main]

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run source checks
        run: npm test
